<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital@0;1&family=Syne:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #0f0f0f;
      --accent: #c8f060;
      --muted: #2a2a2a;
      --text: #e8e8e8;
      --dim: #555;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    #yt-player {
      position: absolute;
      width: 1px; height: 1px;
      top: -9999px; left: -9999px;
      pointer-events: none;
    }

    .stage {
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      position: relative;
    }

    .stage::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 64px;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }

    .bar {
      width: 4px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
      opacity: 0.85;
      transform-origin: bottom;
      animation: pulse var(--dur, 1s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
      min-height: 4px;
    }

    @keyframes pulse {
      from { height: var(--min-h, 6px); opacity: 0.4; }
      to   { height: var(--max-h, 48px); opacity: 1; }
    }

    .info {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .track-title {
      font-size: clamp(16px, 2.5vw, 24px);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      max-width: 600px;
      line-height: 1.3;
      animation: fadeIn 0.8s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .controls {
      margin-top: 36px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn {
      background: none;
      border: 1px solid var(--muted);
      color: var(--dim);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 2px;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.primary {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.primary:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--dim);
      text-transform: uppercase;
      margin-top: 48px;
      position: relative;
      z-index: 1;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.4s;
    }

    .dot.live {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #gate {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    #gate.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #gate .gate-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dim);
    }

    #gate .gate-title {
      font-size: clamp(28px, 5vw, 56px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    #gate .gate-btn {
      margin-top: 16px;
      padding: 14px 40px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: none;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 2px;
    }

    #gate .gate-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }
  </style>
</head>
<body>

<div id="gate">
  <span class="gate-label">Focus Radio</span>
  <h1 class="gate-title">Press play.</h1>
  <button class="gate-btn" onclick="startRadio()">Start listening</button>
</div>

<div id="yt-player"></div>

<div class="stage">
  <div class="visualizer" id="visualizer"></div>

  <div class="info">
    <span class="label">Now playing</span>
    <div class="track-title" id="track-title">—</div>
  </div>

  <div class="controls">
    <button class="btn" onclick="togglePause()" id="pause-btn">Pause</button>
    <button class="btn primary" onclick="playRandom()">Skip →</button>
  </div>

  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">loading</span>
  </div>
</div>

<script>
  // ─── PLAYLIST ─────────────────────────────────────────────────────────────
  // Add more mixes here: { id: 'YOUTUBE_VIDEO_ID', title: 'Label' }
  const PLAYLIST = [
    {
      id: 'jB8zCEsPn_I',
      title: 'Melodic House & Techno Mix'
    },
    {
      id: 'fPOcBsbu-5Q',
      title: 'Deep House Mix'
    },
    {
      id: 'pwvy7RkWDYE',
      title: 'Melodic Deep House Mix on Vinyl - ep. 51'
    },
    {
      id: 'Ri9NKdvsHXc',
      title: 'NTO Live @ Région Dents du Midi'
    },
  ];
  // ──────────────────────────────────────────────────────────────────────────

  let player = null;
  let currentIndex = -1;
  let isPaused = false;

  // Build visualizer bars
  const viz = document.getElementById('visualizer');
  const BAR_COUNT = 28;
  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const minH = 4 + Math.random() * 8;
    const maxH = 24 + Math.random() * 40;
    const dur  = (0.6 + Math.random() * 0.8).toFixed(2);
    const del  = (Math.random() * 0.6).toFixed(2);
    bar.style.setProperty('--min-h', minH + 'px');
    bar.style.setProperty('--max-h', maxH + 'px');
    bar.style.setProperty('--dur', dur + 's');
    bar.style.setProperty('--delay', del + 's');
    bar.style.height = minH + 'px';
    viz.appendChild(bar);
  }

  function setStatus(live, text) {
    document.getElementById('status-dot').className = 'dot' + (live ? ' live' : '');
    document.getElementById('status-text').textContent = text;
  }

  function setTitle(title) {
    const el = document.getElementById('track-title');
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = '';
    el.textContent = title;
  }

  function pauseVisualizer(paused) {
    document.querySelectorAll('.bar').forEach(b => {
      b.style.animationPlayState = paused ? 'paused' : 'running';
    });
  }

  function pickRandom() {
    if (PLAYLIST.length === 1) return 0;
    let next;
    do { next = Math.floor(Math.random() * PLAYLIST.length); } while (next === currentIndex);
    return next;
  }

  function playIndex(index) {
    currentIndex = index;
    const mix = PLAYLIST[index];
    setTitle(mix.title);
    setStatus(false, 'loading...');
    player.loadVideoById(mix.id);
  }

  function playRandom() {
    playIndex(pickRandom());
  }

  function togglePause() {
    if (!player) return;
    if (isPaused) {
      player.playVideo();
      isPaused = false;
      document.getElementById('pause-btn').textContent = 'Pause';
      pauseVisualizer(false);
      setStatus(true, 'live');
    } else {
      player.pauseVideo();
      isPaused = true;
      document.getElementById('pause-btn').textContent = 'Resume';
      pauseVisualizer(true);
      setStatus(false, 'paused');
    }
  }

  function startRadio() {
    const gate = document.getElementById('gate');
    gate.classList.add('hidden');
    setTimeout(() => gate.remove(), 700);
    initYT();
  }

  function initYT() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = function() {
    const startIndex = pickRandom();
    currentIndex = startIndex;
    setTitle(PLAYLIST[startIndex].title);

    player = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      videoId: PLAYLIST[startIndex].id,
      playerVars: {
        autoplay: 1,
        controls: 0,
        modestbranding: 1,
        rel: 0,
        playsinline: 1,
      },
      events: {
        onReady: (e) => {
          e.target.playVideo();
          setStatus(true, 'live');
        },
        onStateChange: (e) => {
          if (e.data === 0) playRandom();
          if (e.data === 1) {
            setStatus(true, 'live');
            pauseVisualizer(false);
          }
          if (e.data === 3) setStatus(false, 'buffering...');
        },
        onError: () => {
          setStatus(false, 'error — skipping');
          setTimeout(playRandom, 2000);
        }
      }
    });
  };
</script>
</body>
</html>
